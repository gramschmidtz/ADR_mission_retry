# ============================================================
# 물리 상수 및 시스템 파라미터 (논문 Table 1 기준)
# ============================================================

physical:
  mu: 398600000000000.0   # 지구 중력 상수 [m^3/s^2]  (3.986e14)
  Re: 6378140.0           # 지구 적도 반경 [m]
  ge: 9.8066           # 지구 표면 중력가속도 [m/s^2]

  # 구면 조화 계수 (J2만 구현, J3/J4는 참고용)
  J2:  1082.639e-6
  J3:   -2.565e-6
  J4:   -1.608e-6

  # 대기항력 모델 (Exponential Atmospheric Model)
  CD: 2.2              # 항력 계수 [-]
  S:  8.0              # 공력 기준 면적 [m^2]

spacecraft:
  T_max: 0.021         # 최대 추력 [N] (21 mN)
  Isp: 2000.0          # 비추력 [s]
  m0: 400.0            # 초기 질량 [kg] (추진제 100 kg 포함)
  m_prop_max: 100.0    # 최대 추진제 질량 [kg]

orbit:
  disposal_alt_km: 390.0   # 처분 궤도 고도 [km]
  inclination_deg: 87.9    # 궤도 경사각 [deg]
